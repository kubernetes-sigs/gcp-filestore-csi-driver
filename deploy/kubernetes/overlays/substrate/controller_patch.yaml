# Controller Deployment patch for GKE Substrate Agent integration with GCP Filestore CSI Driver.
#
# Key Features & Rationale:
# 1. hostNetwork: false
#    - Disables host networking on the controller pod so GKE Workload Identity metadata server
#      interception works properly, allowing the pod to authenticate as its annotated GCP Service Account.
#
# 2. role: controller-plugin label
#    - Differentiates controller pods from node daemonset pods so the csi-filestore-controller
#      Kubernetes Service only routes gRPC control-plane traffic to this controller.
#
# 3. envoy mTLS proxy sidecar container (TCP port 10000 -> Unix socket /csi/csi.sock)
#    - Substrate's ate-api-server communicates with CSI drivers over mTLS gRPC network sockets.
#      Because the CSI driver natively listens on a local Unix domain socket, this Envoy
#      proxy intercepts mTLS traffic on TCP port 10000 and forwards it to the Unix socket.
#    - Envoy serves the pod's servicedns certificate (servicedns-certs volume) and verifies
#      the client against the podidentity CA bundle (podidentity-ca volume). Kubelet rotates
#      both in place, and envoy_configmap.yaml delivers them through file-based SDS with
#      watched_directory so Envoy picks up the new files without a restart (b/586528501).
#    - The Envoy image is pinned by tag and digest. When bumping it, keep the SDS and
#      watched_directory configuration in envoy_configmap.yaml and run envoy_config_test.go.
#
# 4. --feature-volume-pools=true and --feature-volume-pool-quota=true
#    - Enables VolumePool capacity management and per-volume quota sizing. Set
#      --feature-volume-pool-quota=false to fall back to the pool default without
#      rolling back the driver.
#
# 5. Workload Identity Cleanup ($patch: delete)
#    - Removes static secret volume mounts (cloud-sa-volume) and GOOGLE_APPLICATION_CREDENTIALS
#      env variables in favor of dynamic, short-lived OAuth tokens via GKE Workload Identity.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcp-filestore-csi-controller
  namespace: gcp-filestore-csi-driver
  labels:
    role: controller-plugin
spec:
  template:
    metadata:
      labels:
        role: controller-plugin
    spec:
      hostNetwork: false
      # Remove static Service Account key secret volume; authentication is handled via GKE Workload Identity
      volumes:
      - name: cloud-sa-volume
        $patch: delete
      - name: envoy-config
        configMap:
          name: csi-envoy-config
      - name: servicedns-certs
        projected:
          sources:
          # Kubelet requests a new certificate before this one expires and swaps it in
          # place. maxExpirationSeconds is unset, so the API server defaults it to 86400
          # (24h). See README.md "Testing certificate rotation" to shorten it for testing.
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      - name: podidentity-ca
        projected:
          sources:
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      containers:
      # envoy mTLS proxy sidecar intercepts traffic on port 10000 to the local Unix CSI domain socket for Substrate control plane
      - name: envoy
        # v1.34.14 multi-arch (amd64, arm64) image index digest from Docker Hub.
        image: envoyproxy/envoy:v1.34.14@sha256:cfc0678bc03cca19cbb031688acb31d510bff501ff97e163026a375fe0515d69
        command: ["/usr/local/bin/envoy"]
        args: ["-c", "/etc/envoy/envoy.yaml"]
        securityContext:
          privileged: true
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
        - name: socket-dir
          mountPath: /csi
        - name: servicedns-certs
          mountPath: /run/servicedns
          readOnly: true
        - name: podidentity-ca
          mountPath: /run/podidentity-ca
          readOnly: true
      - name: gcp-filestore-driver
        volumeMounts:
        # Explicitly retain socket-dir mount for CSI operations
        - name: socket-dir
          mountPath: /csi
        # Remove static SA key secret mount
        - name: cloud-sa-volume
          $patch: delete
        env:
        # Remove GOOGLE_APPLICATION_CREDENTIALS for dynamic Workload Identity token discovery
        - name: GOOGLE_APPLICATION_CREDENTIALS
          $patch: delete
        args:
        - "--v=4"
        - "--endpoint=unix:/csi/csi.sock"
        - "--controller=true"
        - "--feature-volume-pools=true"
        - "--feature-volume-pool-quota=true"
