# Node DaemonSet patch for GKE Substrate Agent integration with GCP Filestore CSI Driver.
#
# Key Features & Rationale:
# 1. role: node-plugin label (pod template and selector)
#    - Differentiates Node DaemonSet pods from Controller Deployment pods so that the
#      csi-filestore-controller Service does not route gRPC controller requests to nodes.
#    - The label is also part of spec.selector, so the node DaemonSet and the controller
#      Deployment no longer share the same selector. spec.selector is immutable; see README.md
#      for upgrading an existing install.
#
# 2. Bidirectional Mount Propagation (/var/lib/ateom-gvisor)
#    - Substrate's ateom-gvisor daemon on worker nodes manages microVM actor volume staging
#      under /var/lib/ateom-gvisor.
#    - Mounting this host directory with 'mountPropagation: Bidirectional' allows NFS shares
#      mounted by the CSI node driver to be immediately visible to the host and accessible
#      by Substrate worker pods during actor resume.
#
# 3. Scale tuning (sized from Substrate VolumePool scale tests)
#    - Burstable QoS for the node plugin: requests cover steady state, while limits leave room
#      for mount/unmount bursts. Requests are reserved on every node, so they are kept small.
#    - --v=2 drops the verbose per-RPC request/response logs (V(4)/V(5)) while keeping INFO logs.

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gcp-filestore-csi-node
  namespace: gcp-filestore-csi-driver
  labels:
    app: gcp-filestore-csi-driver
    role: node-plugin
spec:
  selector:
    matchLabels:
      role: node-plugin
  template:
    metadata:
      labels:
        role: node-plugin
    spec:
      containers:
      - name: gcp-filestore-driver
        args:
        - "--v=2"
        - "--endpoint=unix:/csi/csi.sock"
        - "--nodeid=$(KUBE_NODE_NAME)"
        - "--node=true"
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            cpu: "3"
            memory: 6Gi
        volumeMounts:
        # Propagate mounts to the Substrate ateom-gvisor directory on the host
        - name: ateom-dir
          mountPath: /var/lib/ateom-gvisor
          mountPropagation: Bidirectional
      volumes:
      - name: ateom-dir
        hostPath:
          path: /var/lib/ateom-gvisor
          type: DirectoryOrCreate
