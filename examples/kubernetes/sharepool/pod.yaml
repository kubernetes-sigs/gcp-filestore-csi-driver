apiVersion: v1
kind: Pod
metadata:
  name: sharepool-test-pod
spec:
  containers:
  - name: test-container
    image: busybox
    command: ["/bin/sh", "-c"]
    args: ["echo 'Hello from SharePool!' > /mnt/test.txt && sleep 3600"]
    volumeMounts:
    - mountPath: /mnt
      name: sharepool-vol
  volumes:
  - name: sharepool-vol
    persistentVolumeClaim:
      claimName: sharepool-pvc
