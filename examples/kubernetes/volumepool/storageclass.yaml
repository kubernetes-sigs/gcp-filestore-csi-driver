apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: volume-pool-sc
provisioner: filestore.csi.storage.gke.io
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  volume-pool: "projects/demo-project/locations/us-central1/volumePools/demo-pool-1"
# NFSv3 mount options that are safe when several nodes mount a volume at the same
# time. They match the CSI driver's defaults for VolumePool volumes; they are set
# explicitly because older driver releases default to only vers=3,proto=tcp,mountproto=tcp.
# Any value here replaces all of the driver's default mount options, so list every
# option you want. Add nolock and actimeo=60 only in a separate StorageClass for
# volumes that one node mounts at a time.
mountOptions:
  - vers=3
  - proto=tcp
  - mountproto=tcp
  - port=2049
  - mountport=2050
  - nconnect=8
  - rsize=524288
  - wsize=524288
