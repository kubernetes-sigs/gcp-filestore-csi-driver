apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: volumepool-pvc
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: volume-pool-sc
  resources:
    requests:
      # Capacities other than the VolumePool's default volume quota (1024 MiB
      # unless the VolumePool sets another) take longer to create, and need the
      # project to be allowlisted for volume quota updates. See "Volume Size" in
      # deploy/kubernetes/overlays/substrate/README.md.
      storage: 1Gi
