# Sample StorageClass for GKE Substrate integration with GCP Filestore VolumePools.
#
# VolumePools (FiFA Fast Availability) provide sub-second dynamic volume claims from
# pre-warmed Filestore multi-share instances.
#
# Parameters:
#   volume-pool: The full resource name of the VolumePool:
#                "projects/<PROJECT_ID>/locations/<GCE_LOCATION>/volumePools/<VOLUMEPOOL_NAME>"
#
# Usage:
#   1. Replace <PROJECT_ID>, <GCE_LOCATION>, and <VOLUMEPOOL_NAME> with your values.
#   2. Apply: kubectl apply -f examples/kubernetes/substrate-volumepool/storageclass.yaml

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: csi-filestore-volumepool-sc
provisioner: filestore.csi.storage.gke.io
parameters:
  volume-pool: "projects/<PROJECT_ID>/locations/<GCE_LOCATION>/volumePools/<VOLUMEPOOL_NAME>"
allowVolumeExpansion: false
reclaimPolicy: Delete
volumeBindingMode: Immediate
